# =============================================
# DATABASE CONFIGURATION - MySQL
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/l_farma?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA CONFIGURATION
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# =============================================
# SERVER CONFIGURATION - Para ngrok y dispositivos fisicos
# =============================================
server.port=8091
server.address=0.0.0.0
server.error.include-message=always
server.error.include-stacktrace=always

# =============================================
# MONGODB CONFIGURATION
# =============================================
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=l_farma

# =============================================
# REDIS CONFIGURATION
# =============================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# =============================================
# THYMELEAF CONFIGURATION
# =============================================
spring.thymeleaf.cache=false

# =============================================
# JACKSON CONFIGURATION
# =============================================
spring.jackson.time-zone=America/Lima

# =============================================
# LOGGING CONFIGURATION
# =============================================
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.session.data.redis=DEBUG
logging.level.com.App.Lfarma=DEBUG

