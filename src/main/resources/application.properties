
spring.datasource.url=jdbc:mysql://localhost:3306/l_farma?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Server Configuration
server.port=8091
server.error.include-message=always
server.error.include-stacktrace=always

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=l_farma

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Jackson Configuration
spring.jackson.time-zone=America/Lima

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.session.data.redis=DEBUG
logging.level.com.App.Lfarma=DEBUG