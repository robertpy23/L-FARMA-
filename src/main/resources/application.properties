spring.datasource.url=jdbc:mysql://localhost:3306/l_farma
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8091

# Configuraci√≥n de logging para depuraci√≥n
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Configuraci√≥n de Thymeleaf
spring.thymeleaf.cache=false

spring.data.mongodb.host=${SPRING_DATA_MONGODB_HOST:localhost}
spring.data.mongodb.port=${SPRING_DATA_MONGODB_PORT:27017}
spring.data.mongodb.database=l_farma

server.error.include-message=always
server.error.include-stacktrace=always
spring.jackson.time-zone=America/Lima

spring.data.redis.host=localhost
spring.data.redis.port=6379
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.session.data.redis=DEBUG


upload.path=/opt/app/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Para deshabilitar auto-configuraciÛn si no usas todas
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# O especificar los paquetes de repositorios
spring.data.jpa.repositories.base-packages=com.App.Lfarma.repository.jpa
spring.data.mongodb.repositories.base-packages=com.App.Lfarma.repository.mongo

# ConfiguraciÛn para archivos est·ticos
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Para desarrollo, mostrar errores detallados
spring.web.resources.add-mappings=true


